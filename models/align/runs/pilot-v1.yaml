# The alignment run the pilot is measured with. Every value here is part of the run's hash, so
# changing one writes a new set of unit ids rather than overwriting the old ones.
name: pilot-v1
detector: models/detector/artifacts/detector.onnx
classifier: models/classifier/artifacts/classifier.onnx
detector_version: rtdetr_r18vd-6e
classifier_version: convnext_tiny-12e
# The export this run was measured with; the run refuses any other file at the classifier path.
classifier_sha256: e761e7b7e8e5b6e16061d70de82e478ee27cb9111fe06af2fc0df2a9c07975f8
# The operating point every stage of this run detects at, including the aligner's own detector. It is
# unset in the run's hash: the pilot's units were found at this score before it was written down.
score: 0.02
# The detector's cross-tile suppression, measured on val: `models/detector/nms-sweep.json`.
nms: 0.2
# align-v1 composes the kana readings, compatibility ideographs, 新旧字体, 異体字, voicing and
# small-kana relations; see data/vocab/equivalence-policies.yaml.
policy: align-v1
weights:
  skip-token: 8.0
  skip-detection: 6.0
  split: 12.0
  merge: 14.0
  gap: 3.0
# A unit is accepted when its match probability is at least this and the best path beats the second
# best by this margin; the pilot tunes both on the calibration pages.
accept: 0.9
margin: 1.0
ruby: false
