# The classifier: the backbone, the preprocessing and the hyperparameters that train.py and
# export_onnx.py read; glyph_atlas.classify takes the size from the export. The framework versions
# are the ones the 2026-09-11 installation spike verified on the workstation (see SPIKE.md).

framework: timm
# CAFormer-S18 (MetaFormer: convolution stages, then attention stages) through timm, ImageNet-22k
# pretrained and fine-tuned on ImageNet-1k, Apache-2.0. models/benchmark/README.md compares it with
# ConvNeXt, ConvNeXt V2, DINOv2, EVA-02 and DeiT III backbones on the held-out sets.

model:
  checkpoint: caformer_s18.sail_in22k_ft_in1k
  # the checkpoint's 1000-class head is replaced by one over the class list
  pretrained: true
  licence: Apache-2.0

preprocessing:
  # one crop is one character; the export fixes the size and the served classifier reads it from
  # the export's input, because a model trained at one size and served at another is a different
  # model
  size: 128
  # grey: the crops carry no colour the classifier uses, and the pages are bitonal scans
  grey: true
  # aspect preserved by padding to a square with white, then resized; never stretched
  pad: 255
  # the ImageNet statistics averaged over the three channels, which the grey channel is normalised
  # with; classify.MEAN and classify.STD are the same two numbers
  mean: 0.449
  std: 0.226

data:
  # written by models/classifier/build_combined.py over build_manifests.py's CODH crops
  directory: work/classifier-combined
  splits:
    train: train.parquet
    val: val.parquet
    test: test.parquet
  # the class order build_combined.py writes
  classes: models/classifier/classes.json
  # a code point with fewer crops than this in train is not a class: it is trained as `other`
  min_train_crops: 5
  other: other

training:
  # 16 GB VRAM, batch 64 at 96 square, mixed precision, within the workstation's budget
  epochs: 12
  batch_size: 64
  optimizer: adamw
  lr: 0.001
  backbone_lr: 0.0001
  weight_decay: 0.05
  warmup_steps: 500
  scheduler: cosine
  precision: bf16
  grad_clip: 1.0
  label_smoothing: 0.1
  # every class is drawn as often as every other, so a class with 20 crops is not drowned by one
  # with 22,000; the sampler weight of a crop is 1 / (crops of its class in train)
  sampler: class_balanced
  # scans differ in contrast and exposure and a character keeps its shape under both; a character
  # mirrored or rotated is a different character, so neither is used
  augment: brightness_contrast
  num_workers: 8
  seed: 0
  checkpoint_every: 1

calibration:
  # temperature scaling on the val crops, which are drawn in proportion to their frequency: the
  # training sampler is class-balanced and the served distribution is not, so the temperature is the
  # one correction the two need
  method: temperature
  fit_on: val
  # expected calibration error, top-1 confidence against accuracy
  bins: 15

evaluation:
  top_k: 5

artifacts:
  # checkpoints and exports are not committed
  directory: models/classifier/artifacts
  export: models/classifier/artifacts/classifier.onnx
  # a crop is always 96 square, so the export fixes the batch and the size instead of making them
  # dynamic; the legacy exporter writes one self-contained file
  batch: 1
  exporter: legacy
  opset: 17

versions:
  python: "3.14.0"
  torch: "2.14.0+cu130"
  torchvision: "0.29.0+cu130"
  timm: "1.0.29"
  onnx: "1.22.0"
  onnxscript: "0.7.2"
  onnxruntime-gpu: "1.30.0"
  numpy: "2.5.3"
  pillow: "12.3.0"
  pyarrow: "21.0.0"
  pyyaml: "6.0.3"
  cuda: "13.0"
  driver: "580.97"
