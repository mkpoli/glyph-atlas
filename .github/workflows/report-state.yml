# Open or close the collection-state issue.
#
# A scheduled run that fails quietly is indistinguishable from a run that found
# nothing new. Call this with `failed` to make the silence loud, and with
# `recovered` to mark the issue resolved once a run succeeds again.
name: report-state

on:
  workflow_call:
    inputs:
      state:
        description: "failed or recovered"
        required: true
        type: string

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = 'Collection harvest is failing';
            const state = '${{ inputs.state }}';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'harvest',
              per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);

            if (state === 'failed') {
              const body = [
                `A scheduled harvest run failed on ${new Date().toISOString()}.`,
                ``,
                `The upstreams are third-party hosts, so this can be transient;`,
                `the next scheduled run will retry. Check the run log for`,
                `whether the failure was a paced refusal, a timeout, or a bug.`,
                ``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                  `/actions/runs/${context.runId}`,
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['harvest'],
                });
              }
              return;
            }

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: 'A scheduled harvest run succeeded again.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
