# Licence statements the upstreams use, one entry per statement.
#
# `match` lists every spelling of the statement: the licence id an upstream field carries, the
# label a page prints, and the URL of the page itself. Two matches that name the same statement
# stay in one entry, so http and https, `deed.ja` and `deed.en`, and the `page/` and `vocab/`
# spellings of a RightsStatements identifier all resolve alike.
# `licence` is the value recorded on the record. `evidence` is the page that states it.
# `eligible` says whether material under the statement may go into the CC BY-SA 4.0 release;
# `per-item` means the holder states the licence of each item on the item's own page, so the
# statement alone grants nothing. `checked` is the date the statement was last read.

- match:
    - CC0-1.0
    - CC0 1.0
    - CC0
    - Creative Commons Zero 1.0 Universal
    - https://creativecommons.org/publicdomain/zero/1.0/
    - https://creativecommons.org/publicdomain/zero/1.0/deed.ja
    - https://creativecommons.org/publicdomain/zero/1.0/deed.en
    - http://creativecommons.org/publicdomain/zero/1.0/
    - http://creativecommons.org/publicdomain/zero/1.0/deed.ja
  licence: CC0-1.0
  label: CC0 1.0 Universal
  evidence: https://creativecommons.org/publicdomain/zero/1.0/
  eligible: true
  obligations: "No conditions. The waiver is recorded as such; a notice the source supplies is kept."
  checked: 2026-09-11

