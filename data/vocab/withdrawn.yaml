# Documents withdrawn from the atlas. Extraction skips their pages, every export and publication
# leaves their crops out, and `scripts/withdraw_documents.py` writes the SQL that removes what the
# site already holds. Their tables, transcriptions and production metadata stay in the local datasets.
version: 1
withdrawals:
  - decided: 2026-10-02
    reason: >-
      Noisy Meiji typeset scans that mislead OCR and form clustering (`docs/form-input-quality.md`),
      with unsettled image rights: `licences.yaml` records the terms page they cite as restricted
      and outside a release build, while Honkoku-Lines labels them CC BY 4.0 and the page itself
      calls its terms equivalent to CC BY. The same holder's other documents are not withdrawn.
    evidence:
      - https://www.lib.u-tokyo.ac.jp/ja/library/contents/archives-top/reuse
      - https://huggingface.co/datasets/yuta1984/honkoku-lines/blob/main/items.tsv
    documents:
      hl:832a01dee4dfafb4d18c1ab4a645a4b0: 風俗畫報臨時増刊第百十八號　大海嘯被害録（上）
