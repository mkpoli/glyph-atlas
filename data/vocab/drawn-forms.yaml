      U+4E8B:7a92b1e8a7 and U+4E8B:465095366d (4,203 glyphs), grouped as one form by mkpoli on 2026-11-16.
      The drawings: supplied by mkpoli on 2026-11-17 as one picture of a serif and a sans figure, traced
