# Drawn forms: ways of writing a character that have no code point, no registered figure and no
# composition an ideographic description sequence could state, such as a cursive form written in
# one stroke. Each is named by a private-use code point of this table (docs/decisions/0014-drawn-forms.md)
# and drawn in two styles, `drawn-forms/<code point>.sans.svg` and `.serif.svg`, each one filled path in
# a 1000-unit em with y running down.
#
# A drawing is an editorial normalisation of the form its `basis` names. It is a label for a group of
# crops and is never shown as an occurrence. A drawn form is a member of the family of the grapheme it
# writes: `refs` reads this table beside `characters.tsv`.
#
# The code points are in Supplementary Private Use Area-A. One is never given to another form, and a
# form keeps its code point when its drawing is redrawn. `version` changes only if that rule is broken.
#
# Fields of a row:
#   written_for  the grapheme the form writes, by the code point of its head
#   script       the script the form is coloured and counted as
#   name         what the form looks like, for a reader who cannot see the drawing
#   basis        the crops the form was found in, and who drew it
#
# `drawn-forms/<code point>.source.png` is the picture a form's drawings were traced from, the serif
# figure on the left and the sans one on the right. `scripts/trace_form.py` traces it;
# `scripts/build_drawn_forms.py` writes the fonts and the Worker's table.
namespace: glyph-atlas
version: "1"
forms:
  U+F0000:
    written_for: U+4E8B
    script: han
    name: 事 in one cursive stroke, a hooked head over a loop that the stroke crosses on its way down to the left; like る
    basis: >-
      The form: forms clustering 582865e3b2b68c53 of 事, read on https://glyphatlas.org/ja/forms/U+4E8B on
      2026-11-16, clusters U+4E8B:6a8ba32233, U+4E8A:b5bd305407, U+4E8B:f98b4cc741, U+4E8B:24bd4fd4ab,
