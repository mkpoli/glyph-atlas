  U+3094: ゔ
  # The small kana. A small letter is a letter and not a form of the full-size one - っ is not つ -
  # so each is its own grapheme, and this map is what says so: a character listed here is a grapheme
  # of its own, and ゕ reads ゕ rather than か. ゕ and ゖ are the small か and け of the Ainu
  # orthography and the rest are the small kana of the 五十音.
  U+3041: ぁ
  U+3043: ぃ
  U+3045: ぅ
  U+3047: ぇ
  U+3049: ぉ
  U+3063: っ
  U+3083: ゃ
  U+3085: ゅ
  U+3087: ょ
  U+308E: ゎ
  U+3095: ゕ
  U+3096: ゖ
  # The small katakana are forms of the small hiragana: ァ is ぁ, which is not あ. Unicode
  # decomposes ヵ and ヶ to か and け rather than to ゕ and ゖ, so all twelve are listed here.
  U+30A1: ぁ
  U+30A3: ぃ
  U+30A5: ぅ
  U+30A7: ぇ
  U+30A9: ぉ
  U+30C3: っ
  U+30E3: ゃ
  U+30E5: ゅ
  U+30E7: ょ
  U+30EE: ゎ
  U+30F5: ゕ
  U+30F6: ゖ
  # The small kana of the historic blocks, which nothing else maps. 𛅦 is a small 𛀁, which is
  # neither 𛀁 nor え.
  U+1B132: 𛄲
  U+1B150: 𛅐
  U+1B151: 𛅑
  U+1B152: 𛅒
  U+1B155: 𛅕
  U+1B164: 𛅤
  U+1B165: 𛅥
  U+1B166: 𛅦
  U+1B167: 𛅧
  U+1B168: 𛅨
  # Kana Extended-A, the historic kana of the 五十音. A name such as ARCHAIC YE or ALTERNATE NE
  # says which kana the letter is, but the reading is not the letter, so the map states both. A
  # digraph (𛄣 is こと) is not a kana of the 五十音 and is its own grapheme.
  U+1B001: え
  U+1B11F: う
  U+1B120: い
  U+1B121: え
  U+1B122: う

# Fields of a `characters` row, all optional, overriding what the build found:
#   jibo      the 字母, the kanji the form derives from
#   letter    the kana a name that names none is a form of, as when several readings disagree
#   grapheme  the code point of the grapheme this character is a form of
#   readings  what the character reads as, when the name spells no reading
#   alias     a second name, such as the MJ figure name
#   script    the script, when the UCD property is not the label this dataset uses
#   age       the Unicode release that assigned the code point
#   block     the Unicode block
characters:
  # Unicode 18.0, Kana Extended-A. The chart's NamesList carries no "derived from" note for these
  # two, because the note is about kana forms rather than about encodings, but the proposal that
  # added them states the 字母 in words.
  #   L2/25-151R, "Proposal on two alternate Katakana letters" (Eiso Chan, 2025-07-05), §2:
  #     "For the proposed alternate Katakana letter NE, it is derived from Kanji 子."
  #     "For the proposed alternate Katakana letter WI, it is derived from Kanji 井."
  # Provisionally assigned by UTC #184, consensus 184-C38, and published in Unicode 18.0.
  U+1B127:
    jibo: [子]
  U+1B128:
    jibo: [井]

  # HENTAIGANA LETTER N-MU-MO-1 and -2 read ん, む and も, and the first reading is the one that
  # would name their grapheme. They are not ん first: the character is a む form, and the two are
  # the last of the む hentaigana. Unicode puts them after WO-7 in Kana Extended-A and before
  # WU, which is the position of a ん form, so the reading order alone does not settle it.
  #   `data/vocab/mj-hentaigana.tsv` gives both the 音価 ん/む/も and no reading order.
  # The name does: `N-MU-MO` is the reading of 无, whose 音価 the MJ table lists in that order,
  # and 無, the same kanji, is not a ん form. Both are read む in the 五十音 order the kana follow.
  U+1B11D:
    letter: む
  U+1B11E:
    letter: む

