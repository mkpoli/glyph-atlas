# The grapheme layer and the character rows the UCD files cannot settle.
#
# `scripts/build_character_table.py` reads this file and writes `characters.tsv`. The grapheme of a
# kana is the modern kana it is a form of, so that ね, ネ and every 変体仮名 of ね are one
# grapheme: that is the 音価 the writing system distinguishes the shapes by. `kana` is the list of
# those modern kana. Everything else follows from the Unicode names: `HENTAIGANA LETTER WE-3`,
# `KATAKANA LETTER SMALL WE` and `KATAKANA LETTER ALTERNATE NE` all name the kana they are a form
# of, and a name that names no kana is its own grapheme unless an explicit family below groups it.
#
# Every row must cite where it comes from. A row with no evidence is a guess about the writing
# system and does not belong here.
#
# `kana` maps a code point to its reading. It is the standard hiragana, which is what the rest of
# the project reads a kana by - `refs.to_hiragana` maps a katakana through hiragana, and the
# alignment reads a line's kana the same way. Katakana is not listed: a katakana letter and its
# hiragana are one grapheme, and the hiragana names it.
