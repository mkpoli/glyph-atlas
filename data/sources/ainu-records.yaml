# The アイヌ関連資料 project of みんなで翻刻: the platform's own transcriptions of nine witnesses,
# with the bibliographic fields the platform does not state, read from the curation at
# https://github.com/mkpoli/ainu-records (`data/sources.yaml`) and cross-checked against each
# holder's catalogue record there.
#
# `entry` is the platform's entry id, which is also Honkoku-Lines' item id for eight of the nine.
# `work` and `witness` are the curation's slugs; `catalogue` is its db.aynu.org record. The platform
# label carries the volume and the holder in parentheses, so `title` here is the work's title without
# them and the importer keeps the label as the document's title.
#
# Read on 2026-09-11 from https://app.honkoku.org/api/projects/ainu and one
# https://app.honkoku.org/api/entries/{entry} per entry. The platform publishes no entry list for a
# project; the ids below come from the curation and scripts/check_ainu_records.py enumerates the
# project's collections to compare the two.

id: ainu-records
name: アイヌ関連資料
publisher: みんなで翻刻
kind: transcription-corpus
url: https://app.honkoku.org/ainu
licence: CC-BY-SA-4.0
licence_evidence: https://wiki.honkoku.org/doku.php?id=guideline
attribution: みんなで翻刻（https://honkoku.org/）翻刻データ, CC BY-SA 4.0
counts:
  entries: 9
  canvases: 658
  pages_with_text: 520
  pages_without_text: 138
  characters: 167132
  characters_as_of: 2026-09-11
access:
  project_api: https://app.honkoku.org/api/projects/ainu
  entry_api: https://app.honkoku.org/api/entries/{entry}
  collection_api: https://app.honkoku.org/api/collections/{collection}
  platform_entry: https://app.honkoku.org/transcription/{entry}/{page}
  curation: https://github.com/mkpoli/ainu-records
format:
  entry_record: label, size, license, attribution, manifestUrl, metadata, canvases, transcriptions
  canvas: id, width, height, imageUrl, infoJsonUrl, thumbnailUrl
  transcription: index, canvasId, text, updatedAt, status, notes, annotations
  text: "one string per canvas; newlines are the transcriber's, physical lines in prose and one
    dictionary entry per line in 藻汐草 and 蝦夷方言"
  markup: https://wiki.honkoku.org/doku.php?id=howto_markup
notes:
  - The platform's project record says 80 entries and 5,581 images in total; this file covers the
    nine that the curation has read, which the project's collections also hold.
  - No transcription in this project carries an annotation, so the atlas gains no character box from
    it; the boxes come from the alignment stage, which runs the detector on the page images.
  - "Holding institutions and terms: 国立国語研究所 CC BY 4.0 (two witnesses), 国文学研究資料館 PDM
    1.0, 北海道大学附属図書館 CC BY-SA 4.0 (two witnesses, both photographed by 国文学研究資料館),
    龍谷大学図書館 and 筑波大学附属図書館 (via 国書データベース) and Wereldmuseum Leiden: reuse terms
    that the rights vocabulary records as restricted."

