notes:
  - The NDL manifests of all sixteen volumes state Access Restrictions PDM (read 2026-10-02).
  - The 高山寺本 has six lines to a half-leaf, each line holding an upper and a lower entry (高田時雄, as above); KTB numbers the entries of a line in reading order, embedded ones included, without saying which is upper.
  - How the 崇文叢書 edition was made (photographic or retraced) is not stated in the sources consulted, so images.production is null; a document is classed by the manuscript it reproduces.
