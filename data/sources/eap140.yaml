# The Tangut Collection of the Institute of Oriental Manuscripts, Russian Academy of Sciences, as the
# British Library's Endangered Archives Programme publishes its digitisation (EAP140/1). Every one of
# the 210 files is catalogued as "Maha praj napara mita sutra" (the 大般若波羅蜜多經 in Tangut), a
# concertina or pothi of cotton paper written in gum ink, dated 10th–13th century.
#
# The list is the BL catalogue's EAP140/1 hierarchy, read on 2026-10-17 from
# https://searcharchives.bl.uk/?f%5Broot_ancestor_reference_ssi%5D%5B%5D=EAP140/1&format=json&sort=hierarchy
# (210 files, 25,955 TIFF images); each file's title is the catalogue's, with the date range dropped.
# Each file has a IIIF Presentation 3 manifest at eap.bl.uk/archive-file/EAP140-1-<n>/manifest whose
# canvases point at the IIIF image service images.eap.bl.uk. The catalogue's HTML pages sit behind a
# bot challenge; the manifests and the image service do not.
#
# The manifests carry no transcription: the pages are collected as page images only.

id: eap140
name: The Tangut Collection (EAP140)
publisher: British Library, Endangered Archives Programme
holder: Institute of Oriental Manuscripts, Russian Academy of Sciences
kind: image-collection
url: https://eap.bl.uk/project/EAP140
licence: PD
licence_evidence: https://eap.bl.uk/archive-file/EAP140-1-52/manifest
image_licence: restricted
attribution: British Library, Endangered Archives Programme, EAP140 (Institute of Oriental Manuscripts, Russian Academy of Sciences)
notes:
  - Each manifest's requiredStatement reads "Except as otherwise permitted under your national copyright law this material may not be copied or distributed further", and the catalogue's user condition is "For research purposes only". The images reproduce 10th–13th-century manuscripts, so under docs/licensing.md (Copyright in crops) they are recorded as public domain and the statement is kept as the holder's terms, verbatim in each document's `holder_statement`.
  - Digitised by the Institute of Oriental Studies, Russian Academy of Sciences, with funding from the Endangered Archives Programme supported by Arcadia (manifest metadata).
  - The last canvas of a file is often a larger shot (e.g. 7230 x 5428 for EAP140/1/52 against 1612 x 2466 for its pages), kept as a page like the others.
