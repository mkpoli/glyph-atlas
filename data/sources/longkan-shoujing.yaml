notes:
  - The holder is the one the reproduction states on its first leaf, 據中國國家圖書館藏宋刻本影印 (PDF page 2). No source read dates this impression, so it carries no printing date.
  - The table is roughly proofread (粗校, each row marked AI初校, notes signed Kimi); its README says the origin of the first transcription of 龍龕手鏡 and its licence could not be traced. The table places and labels crops and is not republished.
  - A headword the table writes with the same character within two rows, or whose note says it was filled in or doubts it, is not cut. Of 112 crops read against the print on 2026-11-26 (a blind choice of four, then enlarged), 6 were wrong and all 6 were such headwords.
  - The table's 高丽本 column covers volumes 1, 3 and 4 alone, and NDL opens only volume 1 of that reprint (pid 1194507); its volumes 2 to 4 (1194508 to 1194510) are in-library only, read 2026-11-25.
  - The half-leaf a page shows is found by fit, not by its number; the table skips numbers between volumes.
