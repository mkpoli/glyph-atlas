notes:
  - The holder is the one the reproduction states on its first leaf, 據中國國家圖書館藏金刻本影印 (PDF page 3). 邢準's preface (PDF pages 8 and 9) ends 時大定戊申秋七月望日序, 大定 28 of the 金 (1188); no source read dates this impression, so it carries no printing date.
  - The table is roughly proofread (粗校, each row marked AI初校); its README says the origin of the first transcription of 新修玉篇 could not be traced. The table places and labels crops and is not republished.
  - A headword printed with several readings has a row for each; they share its place on the half-leaf (推导页内字序) and are read as one headword. A field the table fills with an editor's note (［口部開頭缺］, [=此处版面残缺=]) is a headword placed and not labelled.
  - The circles before some headwords mark the work each was taken from (舊字号樣 and 新字号樣, PDF page 10). They are not modelled; the tape absorbs their height.
