format:
  pages: "v1/{book}/{image}.json and v2/{project}/{book}/{page}.json; each a list of {boundingBox: 4 points, id, isVertical, text, isTextline, confidence}"
  metadata: "csv: Project ID, Book ID, Book Name, Attribution, File ID, Image URL, GitHub URL"
  images: not included; Image URL points at full-size images, NDL ones as IIIF Image API URLs
notes:
  - Line boxes were matched to みんなで翻刻 lines automatically; only confident matches are kept, so pages are rarely complete.
  - Text is the transcription line as written on the platform, markup included.
  - Images come from several holders (NDL, 東京大学地震研究所 and others named in Attribution); the image rights are the holder's, the text is CC BY-SA 4.0.

counts_note: >
  The 20240207 archive holds 641,632 line rows: 66,537 in v1, as its release note states, and
  575,095 in v2 against the 456,746 the note states. The 2023 release matches its own note exactly
  on both counts, so the 20240207 note does not describe its own archive; the importer reads the
  archive as it stands and the difference is reported.
