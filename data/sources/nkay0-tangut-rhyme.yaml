# The Tangut rhyme-dictionary table: for each character its 四角号碼, the 李範文 2008 and Kychanov 2006
# numbers, its place in the two editions of 同音 and in 文海, and the 文海 fanqie. The repository
# states no licence. A character's place in a named dictionary is a fact that the dictionary's own
# leaves show; the atlas records the table as public domain, as it does the cjkvi-variants tables,
# and cites the dictionaries the compiler names.

