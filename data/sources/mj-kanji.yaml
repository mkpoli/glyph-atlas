mapping:
  column_used: 対応するUCS
  reason: >-
    対応するUCS states, for every MJ figure, the ISO/IEC 10646 code point it corresponds to. 5,072
    code points have more than one MJ figure under this column, and every one of them belongs in
    variants. 実装したUCS is kept alongside it but is not the mapping column, because it names only
    the single figure IPAmj明朝フォントVer.006.01 chose as the default glyph for a code point shared
    by several figures (52,607 of the 58,859 mapped rows carry it); using it instead would silently
    drop the non-default figures. 実装したMoji_JohoコレクションIVS is kept as well, for the IVS a
    figure was implemented with, where one exists.
notes:
  - The workbook mji.00602.xlsx declares conformance="strict" (Strict Open XML); common xlsx readers
    such as openpyxl cannot open it, so the importer reads xl/sharedStrings.xml and
    xl/worksheets/sheet1.xml with the standard library's xml.etree and zipfile instead.
  - Three MJ figures (MJ037229, MJ040579, MJ042077) carry no 対応するUCS; their 備考 records that the
    figure's Unicode correspondence was withdrawn and names the MJ figure that replaced it.
