notes:
  - No reuse licence or photographer credits are stated in the article. Links to third-party coin pages do not establish ownership or permission for these files.
  - Photographs depict three-dimensional objects; the age of a coin does not establish the rights of its photograph. Editorial diagrams depict proposed readings.
  - The Fusheng and Bingde diagrams are alternative readings of the same coin type. West also questions the Zhenguan and Zhengde reign-period identifications.
  - West describes worn coins and circulating fakes. These records make no independent authenticity determination.
  - The seal, manuscript extract and Bushell character chart in the article are outside this coin-image selection.
  - The article digest is the one read by hand on the checked date; the import does not fetch or recheck the article.
reading_order: top-right-bottom-left
reading_system: Li Fanwen, Xia-Han Zidian (1997), as quoted in West's table; reconstructed pronunciation
coins:
  - id: fusheng
    title: 福聖寶錢 / 稟德寶錢 (Fusheng / Bingde)
    label: Fusheng / Bingde Baoqian
    reign_period_as_reported: Fusheng Chengdao 福聖承道 [1053-1056]
    status: disputed
    note: West leaves Fusheng, Bingde or another reading unresolved; both diagrams concern the same coin type.
    readings:
      - label: Fusheng Baoqian 福聖寶錢
        inscription: 𗼃𗼕𘏨𘔭
        reconstruction: śjɨj ljo ljɨ̣ dzjɨj
      - label: Bingde Baoqian 稟德寶錢
        inscription: 𗣼𗧯𘏨𘔭
        reconstruction: tśhja ꞏji̲j ljɨ̣ dzjɨj
    example_url: http://www.zeno.ru/showphoto.php?photo=16068
  - id: daan
    title: 大安寶錢 (Da'an)
    label: Da'an Baoqian
    reign_period_as_reported: Da'an 大安 [1076-1085]
    status: clear-in-source
    note: West describes this reading as clear; the article supplies an editorial diagram only.
    readings:
      - label: Da'an Baoqian 大安寶錢
        inscription: 𘜶𗵐𘏨𘔭
        reconstruction: tha nej ljɨ̣ dzjɨj
    example_url: http://www.zeno.ru/showphoto.php?photo=1084
  - id: zhenguan
    title: 貞觀寶錢 / 觀德寶錢 (Zhenguan / Guande)
    label: Zhenguan / Guande Baoqian
    reign_period_as_reported: Zhenguan 貞觀 [1102-1114]
    status: disputed
    note: West reads the top and right characters as virtue and observe, and questions the Zhenguan reign-period identification.
    readings:
      - label: Zhenguan Baoqian 貞觀寶錢 / Guande Baoqian 觀德寶錢
        inscription: 𗣼𘝯𘏨𘔭
        reconstruction: tśhja bio̲ ljɨ̣ dzjɨj
    example_url: http://www.zeno.ru/showphoto.php?photo=78
  - id: zhengde
    title: 正德寶錢 / 治德寶錢 (Zhengde / Zhide)
    label: Zhengde / Zhide Baoqian
    reign_period_as_reported: Zhengde 正德 [1127-1134]
    status: disputed
    note: West treats the second character as uncertain and questions the Zhengde reign-period identification.
    readings:
