id: hng-basic-data
name: 漢字字体規範史データセット（HNG）基本データセット
publisher: 漢字字体規範史データセット保存会
kind: character-dataset
url: https://www.hng-data.org/dataset.ja.html
revision: e2174a30844b8100c34af1c0dbe1e301f186883e
licence: CC-BY-SA-4.0
licence_evidence: https://github.com/chise/hng-basic-data/blob/e2174a30844b8100c34af1c0dbe1e301f186883e/README.md
attribution: 漢字字体規範史データセット保存会『漢字字体規範史データセット（HNG）』基本データセット, CC BY-SA 4.0
counts:
  sources: 63
access:
  repository: https://github.com/chise/hng-basic-data
  upstream_repository: https://gitlab.hng-data.org/HNG/hng-basic-data
  crop: https://raw.githubusercontent.com/chise/hng-basic-data/{revision}/{path}
  source_list: https://www.hng-data.org/sources.ja.html
  search: https://search.hng-data.org/
format:
  index: "all_table_v.5.0_2019-01-15.csv: one row per 字体 (統合ID, with b, c… for further 字体 of a character), then 代表字形ID, 字体数, 用例数 for each source code"
  folder_index: "{folder}/char-card-info.csv: 統合ID (大字典番号 in H81), 文字, カード番号, 字体数, 用例数, 部首; read for H80 and H81, which the index does not cover"
  crops: "{folder}/glyphs/BMP/{id}{glyph}.bmp or {glyph}.bmp, one representative crop per 字体 per source; PNG copies exist for some folders only"
notes:
  - HNG stands for Hanzi Normative Glyphs. The cards were made by 石塚晴通 and students at 北海道大学; about 400,000 occurrences in 67 sources by 2005.
  - A crop stands for all occurrences of its 字体 in the source; 用例数 counts them. Page positions are not part of this dataset.
  - The licence is CC BY-SA 4.0 or GPL-2.0-or-later at the user's choice; the atlas takes CC BY-SA 4.0.
  - The GitHub repository mirrors gitlab.hng-data.org, which did not answer on 2026-09-25.
  - The source list names 64 sources; H23 宝篋印陀羅尼經 has 679 entries in the index and no folder or crops in the dataset.
  - Dates are HNG's 作成年代 as written; the importer reads them into year intervals by the rules in its module docstring.
