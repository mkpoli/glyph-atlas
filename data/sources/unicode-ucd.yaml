notes:
  - The 字母 of each hentaigana is an informative `derived from` note in NamesList.txt; the UCD XML has no such attribute.
  - U+1B001 HIRAGANA LETTER ARCHAIC YE carries the alias HENTAIGANA LETTER E-1; U+1B11F HIRAGANA LETTER ARCHAIC WU (Unicode 14.0) has 字母 汙 (U+6C59); 江 (U+6C5F) belongs to U+1B001.
  - Moji_Joho glyph ids in the IVD are MJ文字図形名, so an IVS and an MJ id name the same glyph.
  - "SealSources.txt gives each small seal character (U+3D000–3FC3F) one kSEAL_MCJK, 'the modern CJK equivalent' in the file's words. The value can follow the structure of the seal form (U+3D005 has 叓, where 吏 is written today) and need not (the seal form of 書 is 聿 over 者), and the file says nothing of it; the 異体字 graph records it as the relation `small-seal` and leaves the character written today to the sources that name it."
