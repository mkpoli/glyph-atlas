format:
  entries: "韻書/廣韻.csv: one row per headword of the 澤存堂本, corrected against 廣韻校本 and others; 小韻號, 小韻字號, 韻目原貌, 音韻地位, 反切, 直音, 字頭, 字頭說明, 釋義, 釋義參照"
  order: "src/字序表.csv: 原書小韻號, 小韻字號, 字 and each entry's id in other tables; sbgy_id places it on the printed leaf"
  sbgy_id: "w + volume (1 digit) + leaf (2) + side (a recto, b verso) + column (2, counted from the right) + position in the column (2), e.g. w107b0601; the ids are those of cjkvi-dict sbgy.xml"
  headwords: "字頭 may carry collation marks: ［X］ a character to supply, ｛X｝ one to delete, A〈B〉 a printed A corrected to B"
title: 廣韻（澤存堂本）
