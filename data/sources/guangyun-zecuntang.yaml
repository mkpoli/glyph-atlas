id: guangyun-zecuntang
name: 廣韻（澤存堂本）字頭表（nk2028 tshet-uinh-data）
publisher: nk2028
kind: transcription-corpus
url: https://github.com/nk2028/tshet-uinh-data
revision: 21585e22c8a730ca2fd175112f4d18e16d5ce578
licence: CC0-1.0
licence_evidence: https://github.com/nk2028/tshet-uinh-data/blob/21585e22c8a730ca2fd175112f4d18e16d5ce578/LICENSE
