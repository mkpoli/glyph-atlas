notes:
  - The photographs are 2592 px openings, one leaf's verso on the right and the next leaf's recto on the left. Which library's copy they show is stated nowhere in the repository, so the image licence is unknown and the crops cut from them stay out of every publication until the holder is known.
  - The photographs carry only the work's date: nothing states which impression of the 澤存堂 printing that copy is.
  - The photographs' volume offsets were found by fitting (2026-11-20), each confirmed by the readers on six openings of its volume.
  - The 東文研 copy is a bitonal scan at 1415 px an opening, with a reader's handwritten notes; Commons marks the files public domain. The offsets of volumes 1, 2, 3 and 5 were found on one or two openings each (2026-11-20). Volume 4 (IOC.UTokyo-000149) is not placed: no gutter was found on the two openings tried.
