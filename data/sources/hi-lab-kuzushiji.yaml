notes:
  - Crops come from documents (古文書・古記録); hands and dates differ from the printed books behind the CODH material.
  - No hentaigana code points; kana folders use ordinary hiragana and katakana.
  - Page coordinates and the per-record fields above exist only in the database; its search API answers 403 to plain requests.

counts_note: >
  The archive holds 5,896 code point folders. The published page states 325,261 crops and no
  code point count; 5,887 in the earlier revision of this file came from a count that missed the
  ten code points the root `characters/` subtree does not carry (ゟ U+309F and nine single-crop
  kanji). The kana count takes both kana blocks whole, iteration marks included; CODH's own range
  rule leaves those marks `symbol` and gives 47,198.
