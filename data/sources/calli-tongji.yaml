notes:
  - Read on 2026-09-25 from the ModelScope page and its README; downloading needs a ModelScope login.
  - The open subset holds 50 calligrapher-style classes of 100 images each. The full 317,574-image set is released on a named application to the team.
  - Built by the team from 以观书法's scans of rubbings and ink originals. Rubbings were inverted and every image binarised and denoised by the team's pipeline, so the images carry no paper, colour or stone texture.
  - Styles are 篆, 隶, 楷, 行 and 草. Per style in the open subset, images (calligraphers) are 行 1300 (13), 楷 1300 (13), 草 1500 (15), 篆 500 (5), 隶 400 (4).
  - CC BY-NC 4.0, 「仅供学术研究和教育用途，禁止用于商业目的」. Its images, and anything trained on them, stay out of this project's CC BY-SA releases.
