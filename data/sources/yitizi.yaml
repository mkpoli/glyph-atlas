notes:
  - The ytenx tables come from 韻典網 (ytenx.org) and cover 廣韻 headwords; yitizi.txt is nk2028's own supplement and corrections. The repository declares CC0 for all of it; the licence of the 韻典網 tables it was derived from is not stated separately.
  - yitizi's own OpenCC copy (data/opencc) is not read; OpenCC comes from its own repository.
  - The build applies yitizi's excluded characters and 全等 pairs (build/build_lib/loaders.py) so the rows match what yitizi itself publishes.
  - 交疊 groups are not transitive; each row's detail names the group it came from.
