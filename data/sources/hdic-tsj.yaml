notes:
  - The NDL manifests of all six volumes state Access Restrictions PDM (read 2026-10-02).
  - HDIC's header calls the 天治本 "a complete manuscript of 1124 ... held by the Imperial Household Archives"; TSJ_ndl.tsv also links 宮内庁書陵部's microfilm on 国書データベース, whose terms page is not an open licence, so the atlas places headwords on the 六合館 edition only.
  - How the 六合館 edition was made (photographic or retraced) is not stated in the sources consulted, so images.production is null; a document is classed by the manuscript it reproduces.
