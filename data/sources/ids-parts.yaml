notes:
  - "The `first` column adapts KanjiVG's stroke data and is shared alike under CC BY-SA 3.0, with the 3.0 notice kept; the record takes that licence for the file as a whole. The other columns come from public-domain sequences, MIT-licensed decomposition choices and Unicode data, whose licences ask only for the notices above."
  - "The mapping of KanjiVG's stroke types to the five classes is an editorial table of the build script (提 as 横, 豎鉤 as 豎, 捺 and 提捺 as 點, every turning stroke as 折). Only bare types are mapped: KanjiVG gives one suffixed type to strokes of different classes (㇑a is the top dot of 亠 宀 广 方 立 and the vertical of 山 止 出 上), so a suffixed type gives no class, nor does an alternative whose sides disagree (㇔/㇑). A part's class is kept only when every KanjiVG witness agrees: its own entry, every group drawing it whole (not marked part, partial or variant), and every character with an entry whose sequence starts with it under ⿰ ⿱ ⿸. A component's first stroke can depend on its host: 𠂇 starts with 一 in 左 友 尢 灰 but with 丿 in 右 有 布, the case han-compose's han-hand-forms table records, so 𠂇 has no class. KanjiVG names no 𠂇 group in 右, which is why the hosts are witnesses. The rule is strict: a few dissenting groups clear a class (口 has five groups starting with a dot, 一 is a dot in 令), and no other pinned source settles those characters. KanjiVG follows Japanese stroke order. Most parts therefore have no class: 643 of the 967 difficult parts and 196 of the 674 common ones in the build of 2026-10-25."
  - "A part's stroke count is Unihan's first kTotalStrokes value, which Unihan gives for the zh-Hans form where forms differ, while the first-stroke class follows KanjiVG's Japanese order. A CJK stroke counts 1 and is marked derived; a part Unihan lacks takes the sum over the leaves of its first sequence whose leaves all have counts, marked derived, or stays null. CJK Radicals Supplement characters have no Unihan row and no sequence, so their counts are null."
  - "The common set is 常用漢字 (kJoyoKanji, with the form a U+XXXX value points to, such as 剝 for 剥) together with the first level of the 通用规范汉字表 (kTGH positions 1–3500). Every other part that is not a CJK stroke is listed as difficult."
  - "Besides the components that do not decompose, a part is any component whose every sequence is strokes only or strokes and one other component (a stroke being a CJK stroke or a one-stroke ideograph: 𠂉 ⿰㇒一, 𠂇 ⿻一丿, 䒑 ⿱丷一), and any component at least 50 ideographs use (殳 門 髟 齒 䖵). These are the pieces hardest to type, which BabelStone splits further."
  - "The webfont subsets beside the palette (apps/review/static/fonts/Plangothic-ids-parts.woff2, NotoSansCJKjp-ids-strokes.woff2) are Plangothic V2.9.5795 and Noto Sans CJK JP 2.004 under the SIL Open Font License 1.1; apps/review/static/fonts/README.md records them."
checked: 2026-10-25
