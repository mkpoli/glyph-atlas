# 篆書字体データセット: seal forms cut from twelve dictionaries and seal collections, each filed under a
# Han 親字. Book TE00039 is the 陳昌治 edition of 説文解字, the edition Unicode 18.0 cites for its small
# seal characters as kSEAL_CCZSrc; `data/tensho/TE00039/characters.tsv` places its crops on them.

id: codh-tensho
name: 篆書字体データセット
publisher: 情報・システム研究機構 データサイエンス共同利用基盤施設 人文学オープンデータ共同利用センター (ROIS-DS CODH), 一般財団法人 人文情報学研究所
kind: character-dataset
url: https://codh.rois.ac.jp/tensho/
doi: 10.20676/00000390
version: "2.0"
released: 2022-08-11
licence: CC-BY-SA-4.0
licence_evidence: https://codh.rois.ac.jp/tensho/book/TE00039/
attribution: 『篆書字体データセット』（国文学研究資料館が複数の機関から収集／CODH・DHII加工）doi:10.20676/00000390
checked: "2026-11-20"
counts:
  characters: 181084
  code_points: 13213
  titles: 12
