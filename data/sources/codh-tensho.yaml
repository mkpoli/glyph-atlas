# 篆書字体データセット: seal forms cut from twelve dictionaries and seal collections, each filed under a
# Han 親字. Book TE00039 is the 陳昌治 edition of 説文解字, the edition Unicode 18.0 cites for its small
# seal characters as kSEAL_CCZSrc; `data/tensho/TE00039/characters.tsv` places its crops on them and
# `pages.tsv` pins the pages of the 東方學デジタル圖書館 facsimile they were cut from. Books TE00024 to
# TE00026 are the three volumes of 新撰篆書字典 (1924) on the 国立国会図書館's IIIF pages; their tables
# place a crop on a seal character where its 親字 alone answers one or the crop is drawn as one of its
# own. Book TE00003 is 聯珠篆文 (享和二序) on the pages 新潟大学附属図書館 serves through
# 国書データベース, placed by the same rule.

