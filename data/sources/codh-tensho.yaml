notes:
  - Books TE00040 to TE00058 (選集漢印分韻, 朝陽閣字鑑) are CC BY-NC-SA 4.0 and are not imported; the others are CC BY-SA 4.0.
  - 派生した新たなデータセットやソフトウェアを公開する場合は、「原本画像公開元・所蔵者一覧ファイル」を配布物に含めてください (the dataset's page). Each imported book's line of that list (title, provider, holder, URL) is in its document's image attribution, which a release prints in ATTRIBUTION.md; the whole list is at `access.providers`.
  - The 親字 follows the form the book prints, mostly the character whose components answer the seal form's, sometimes the later form of the character (凡例 2 and 3). It is kept on each unit as CODH's reading beside the seal character.
  - "For TE00039 CODH cut the head of each entry and the 篆文 and 或体 below it, and left out the 古文 and 籀文 except those the book calls 篆文 (凡例 3). The coordinates are pixels of CODH's page images, which the dataset does not ship. The pages the 東方學デジタル圖書館 serves are 2390 pixels wide and 0.5815 of that size, with no offset. `codh_page_width`, 4110, is 2390 over that scale: with it every one of the 10,403 crop files, reduced and matched on its page, is found within one pixel of its box (2026-11-20)."
  - "For TE00024 to TE00026 the coordinates are pixels of the 国立国会図書館's full-size images (5,183 to 5,199 pixels wide), counted from one: every crop file, matched on its page, is found one to three pixels left of and above its box (2026-11-20), except on the page the library has replaced since (`replaced_pages`). Every row has Block ID B0001 and Char ID C0001, so the columns of a page are read from the boxes. TE00026 states one crop twice (U+5BFD on TE00026_0012_1), read once, and files one under 〓."
  - "新撰篆書字典 prints one or more seal forms under each 親字 and 聯珠篆文 two over nearly every one, bronze, stone and old script forms among them, without saying which is the small seal form. `scripts/build_tensho_equivalents.py` places a crop on a seal character of Unicode by its 親字 where the title files no other crop under it (6,225 and 12 crops), else by its drawing (3,035 and 3,053): the seal character is one Unicode gives the 親字 and among the three of 11,328 that models/seal/match.py, trained on the crops of TE00039, the glyphs of Sealie (https://github.com/iebb/sealie, OFL 1.1) and the crops of these titles it is sure of, finds nearest. A 古文 or 籀文 that Unicode encodes is placed on its own character. In a random 200 of those 6,088, two are another form than their seal character (2026-11-24, models/seal/sample.tsv). The rest stay on the 親字 in seal style: 2,113 of 新撰篆書字典 and 3,130 of 聯珠篆文."
  - "For TE00003 the coordinates are pixels of the full-size images of 国書データベース (5,616 by 3,744): all 160 crop files of three openings, matched on their pages, lie exactly on their boxes (2026-11-24). The database numbers its canvases from zero and CODH's table from one, so a page is found by its image service."
  - The first release is of 2021-03-31; version 2 of 2022-05-10 added this book, and 176 characters were corrected on 2022-08-11.
