  pages: "{book}_source.csv with columns Image, Manifest URI, Canvas URI, Image Info"
  crops: "characters/U+XXXX/U+XXXX_{image}_X{x}_Y{y}.jpg, the 親字 as folder"
  notes: "{book}_note.txt, the 凡例 and the book's credit"
