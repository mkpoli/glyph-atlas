# 国書データベース (国文学研究資料館): the bibliographic records of the books whose images it serves.
#
# `atlas rights kokusho` reads one record per book the dataset already holds, by its id (`bid`), from
# the JSON the database's own pages read (`/api/biblioDetail/{bid}`), and keeps it under a document's
# `meta.kokusho` with the record URL, the DOI and the date it was read. It fills only a document's
# empty holder and shelfmark, and an `unknown` production from 刊写. The images keep the licence each
# item states; that licence is recorded beside the document's own rights, never in place of them.
#
# The terms (checked 2026-09-27): 「当館が独自に作成した書誌データは、ご自由にお使いいただけます。」
# A credit names the content's title, its holder, any change made to it, and the database, e.g.
# 「『伊勢物語』（国文学研究資料館所蔵）出典：国書データベース，https://doi.org/10.20730/200013710」.
id: kokusho
name: 国書データベース
publisher: 国文学研究資料館
kind: reference-table
url: https://kokusho.nijl.ac.jp/
licence: bespoke-free
licence_evidence: https://kokusho.nijl.ac.jp/page/terms.html
attribution: 出典：国書データベース（国文学研究資料館）, https://kokusho.nijl.ac.jp/
access:
  record: https://kokusho.nijl.ac.jp/biblio/{bid}
  record_json: https://kokusho.nijl.ac.jp/api/biblioDetail/{bid}
  manifest: https://kokusho.nijl.ac.jp/biblio/{bid}/manifest
  doi: https://doi.org/10.20730/{bid}
dates:
  # Read by `atlas dates` (src/glyph_atlas/date_claims.py). A record dates two things: the copy, an
  # item of one holder, and the works it carries (著作, the 国書総目録 entry).
  bpublish: "this copy's own 刊年 (the first entry of 出版事項); printed for 刊, copied for 写"
  chuki: "the notes 〈奥〉〈識〉〈序〉〈跋〉〈刊〉〈版〉〈写〉〈書〉〈加〉 that name a date; read from free text, so derived; （元奥書） is the exemplar's colophon"
  work_year: "the work's date: bare (文明一七) its composition, 刊 its first printing, 序 or 跋 its preface or postface; never the date of this copy"
