# Big Fat Fish on the chat server. Secrets stay in separate files owned by root and readable by the
# fish-bot group; this file names them.

[matrix]
homeserver = "http://127.0.0.1:6167"
token_file = "/etc/fish-bot/matrix-token"

[deepseek]
api_key_file = "/etc/fish-bot/deepseek-key"
model = "deepseek-flash"

[github]
# A fine-grained token with Issues read/write on this repository only, and Metadata read-only.
token_file = "/etc/fish-bot/github-token"
repo = "mkpoli/glyph-atlas"

[bot]
user_id = "@bigfatfish:glyphatlas.org"
display_name = "大肥魚"
# Names that call the bot besides its mention and `!fish`.
aliases = ["大肥魚", "大肥鱼", "Big Fat Fish"]
# Empty means every room in the server's public directory. A list limits the bot to those rooms.
rooms = []
# The homeserver's bridge and bot accounts, which never call the bot.
ignored_senders = [
  "@idsbot:glyphatlas.org",
  "@discordbot:glyphatlas.org",
  "@telegrambot:glyphatlas.org",
  "@heisenbridge:glyphatlas.org",
  "@qqbot:glyphatlas.org",
]

[chat]
# Joining in unasked. After a room has been quiet for ambient_quiet_seconds, a batch of at least
# ambient_min_messages (or one lively message) gets a look with this chance, doubled when lively.
ambient_chance = 0.2
ambient_quiet_seconds = 25
ambient_min_messages = 2
# No unasked turn in a room this soon after the bot last spoke there, and at most this many an hour.
ambient_room_cooldown_seconds = 900
ambient_per_hour = 12

[limits]
context_messages = 120
backfill_messages = 200
min_confidence = 0.7
max_issues_per_day = 5
room_cooldown_seconds = 60
call_window_seconds = 86400
max_rooms = 200
max_calls_per_hour = 60
max_calls_per_user_per_hour = 5
max_chats_per_hour = 120
max_chats_per_user_per_hour = 20
retention_days = 180
