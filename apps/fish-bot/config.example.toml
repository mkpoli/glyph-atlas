# Big Fat Fish on the chat server. Secrets stay in separate files owned by root and readable by the
# fish-bot group; this file names them.

[matrix]
homeserver = "http://127.0.0.1:6167"
token_file = "/etc/fish-bot/matrix-token"

[gemini]
api_key_file = "/etc/fish-bot/gemini-key"
model = "gemini-4-hydrogen"

[deepseek]
# Work nobody hears, at about a tenth of the price. Without this table Gemini does it.
api_key_file = "/etc/fish-bot/deepseek-key"

[compendium]
# 珍字集覽 through its MCP endpoint. She reads it when the chat asks about it, and adds a record or a
# sighting when someone asks her to, at most this many an hour, and this many for one person. Without a
# token_file she writes under one anonymous name that she keeps; with one, as the account it belongs to.
endpoint = "https://rare.glyphatlas.org/mcp"
writes_per_hour = 10
writes_per_person_per_hour = 4

[github]
# A fine-grained token with Issues read/write on this repository only, and Metadata read-only.
token_file = "/etc/fish-bot/github-token"
repo = "mkpoli/glyph-atlas"

[bot]
user_id = "@bigfatfish:glyphatlas.org"
display_name = "大肥魚"
# Names that call the bot besides its mention and `!fish`.
aliases = ["大肥魚", "大肥鱼", "肥魚", "肥鱼", "Big Fat Fish"]
# Rooms where `!fish 自我介紹` gets an introduction; elsewhere it points here.
intro_rooms = ["#welcome:glyphatlas.org", "#chatting:glyphatlas.org"]
# Empty means every room in the server's public directory. A list limits the bot to those rooms.
rooms = []
# The homeserver's bridge and bot accounts, which never call the bot.
ignored_senders = [
  "@idsbot:glyphatlas.org",
  "@discordbot:glyphatlas.org",
  "@telegrambot:glyphatlas.org",
  "@heisenbridge:glyphatlas.org",
  "@qqbot:glyphatlas.org",
  "@telegram_8954644733:glyphatlas.org",
  "@irc_libera_chanserv:glyphatlas.org",
]

[chat]
# Reading along. She opens a room with unread lines at random times, on average this many minutes
# after the first of them (longer after she lately spoke there), and decides whether to join in. At
# most visits_per_hour of these across the rooms.
visit_minutes = 25
visits_per_hour = 8
# Greet a person once, when they first join or first speak in any public room.
welcome = true

[digest]
# From this hour (JST) each day, one digest per room below, written wholly in the language named
# there (with its script where that matters): what the repositories merged and released in the
# last day, and what the other rooms talked about. A quiet day gets none.
hour = 21
repos = [
  "mkpoli/glyph-atlas", "mkpoli/han-compose", "mkpoli/ids-input", "mkpoli/unencoded-db",
  "mkpoli/han-input", "mkpoli/tangut-input", "mkpoli/khitan-input", "mkpoli/jurchen-input",
  "mkpoli/glyph-cutter", "mkpoli/han-decompose", "mkpoli/han2ids", "mkpoli/moji",
]

[digest.rooms]
"#en:glyphatlas.org" = "English"
"#zh:glyphatlas.org" = "Chinese in traditional characters"
"#ja:glyphatlas.org" = "Japanese"
"#ko:glyphatlas.org" = "Korean"
"#vi:glyphatlas.org" = "Vietnamese"

[memory]
# Episodes and notes about people, the community and the bot, kept this many days after they last
# came up. `!fish forget me` deletes a person's.
enabled = true
days = 365

[lookup]
# Web search, page reading and GitHub reads in answers to a call, at most this many an hour.
enabled = true
per_hour = 120

[budget]
# What model calls may cost a day (JST) on average, in dollars at list price. A day may also spend what
# the days before saved, up to one day's worth, and borrow one day's worth from the next ones.
daily_usd = 0.75

[limits]
context_messages = 120
backfill_messages = 200
min_confidence = 0.7
max_issues_per_day = 5
# Feedback about the community's sites and tools is filed without anyone asking, at most three of
# the day's issues.
file_feedback = true
room_cooldown_seconds = 60
call_window_seconds = 86400
max_rooms = 200
max_calls_per_hour = 60
max_calls_per_user_per_hour = 5
max_chats_per_hour = 120
max_chats_per_user_per_hour = 20
retention_days = 180
